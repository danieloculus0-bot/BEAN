name: BEAN bounded autonomous skill composition tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'bean/learning/composition.py'
      - 'bean/learning/experimental.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/tests/test_autonomous_composition.py'
      - '.github/workflows/bean-rule-composition.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest psutil
      - name: Compile BEAN source and rule-composition tests
        run: python -m compileall -q bean
      - name: Verify composition search and truly unseen symbolic input tests
        run: python -m unittest bean.tests.test_autonomous_composition bean.tests.test_native_local_reasoner bean.tests.test_blind_reasoning_probes -v
      - name: Existing Core integration and real journal regression
        run: python -m pytest bean/tests/test_core_reasoning_integration.py bean/tests/test_reasoning_feedback_mainline.py bean/tests/test_local_llamacpp_reasoning.py -q -ra --tb=short

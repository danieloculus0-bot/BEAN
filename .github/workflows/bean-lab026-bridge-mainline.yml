name: BEAN Lab026 integrated Bridge and reasoning adapter research
on:
  push:
    branches: [integrate/bean-lab026-bridge-adapters-mainline-20261025]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  native-bridge-adapters:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          path: bridge-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - run: python -m compileall -q bean/learning
      - run: python -m unittest bean.tests.test_adaptive_brain_port_lab026 bean.tests.test_adaptive_bridge_lab026 bean.tests.test_adaptive_bridge_matrix_lab026 bean.tests.test_adaptive_feedback_lab026 bean.tests.test_adaptive_learning_lab026 bean.tests.test_adaptive_ollama_lab026 bean.tests.test_adaptive_strategy_selection_lab026 -v
      - run: python -m pytest bean/tests -q -ra --tb=short

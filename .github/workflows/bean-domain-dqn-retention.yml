name: BEAN domain DQN retention
on:
  pull_request:
    paths:
      - 'bean/optimization/sponge_dqn.py'
      - 'bean/optimization/sponge_td.py'
      - 'bean/tests/test_dqn_domain_retention.py'
      - 'docs/BEAN_AISCEND_CAUSAL_RETENTION_20261024.md'
      - '.github/workflows/bean-domain-dqn-retention.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-neural-retention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m unittest bean.tests.test_dqn_domain_retention bean.tests.test_learning_runtime bean.tests.test_measured_feedback -v

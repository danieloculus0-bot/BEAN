name: BEAN Neural Evolution evidence lab
on:
  push:
    branches: [experiment/bean-deep-q-learning-20261012, experiment/bean-learner-state-47-49-20261012]
    paths:
      - 'bean/optimization/sponge_dqn.py'
      - 'experiments/sponge_breakout/evolve.py'
      - 'experiments/sponge_breakout/test_evolve.py'
      - '.github/workflows/bean-neuroevolution.yml'
      - 'docs/BEAN_NEUROEVOLUTION_20261012.md'
  pull_request:
    branches: [experiment/bean-sponge-core-20261011]
    paths:
      - 'bean/optimization/sponge_dqn.py'
      - 'experiments/sponge_breakout/evolve.py'
      - 'experiments/sponge_breakout/test_evolve.py'
      - '.github/workflows/bean-neuroevolution.yml'
      - 'docs/BEAN_NEUROEVOLUTION_20261012.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolution-contract:
    name: Neuroevolution smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optional neural research dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Prove real weight evolution, neural backprop, scoring and journal recovery
        run: python -m unittest experiments.sponge_breakout.test_evolve -v
      - name: Run bounded matched control
        run: python -m experiments.sponge_breakout.evolve --out neuroevolution-smoke --seed 41 --population 2 --generations 2 --games 12 --validation 40 --holdout 60
      - name: Keep objective positive and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-smoke-${{ matrix.os }}
          path: neuroevolution-smoke/
          if-no-files-found: warn
  independent-training-seeds:
    name: Guarded evolution trial seed ${{ matrix.seed }}
    if: github.event_name == 'pull_request' || github.ref_name == 'experiment/bean-learner-state-47-49-20261012' || contains(github.event.head_commit.message, '[evo-replicate]')
    needs: evolution-contract
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [47, 48, 49]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural research dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Evolve then test against equal-game-budget uninterrupted DQN
        run: python -m experiments.sponge_breakout.evolve --out neuroevolution-${{ matrix.seed }} --seed ${{ matrix.seed }} --population 3 --generations 3 --games 70 --validation 60 --holdout 120
      - name: Publish reproducible evidence, including losses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-replication-seed-${{ matrix.seed }}
          path: neuroevolution-${{ matrix.seed }}/
          if-no-files-found: warn

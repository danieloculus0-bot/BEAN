name: BEAN autonomous goal cycle regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'bean/runtime/goal_cycle.py'
      - 'bean/runtime/digital_experiment.py'
      - 'bean/runtime/native_skill_experiment.py'
      - 'bean/optimization/skill_incubator.py'
      - 'bean/tests/test_native_skill_experiment.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/learning/local_reasoner.py'
      - 'bean/cognition/goal_state.py'
      - 'bean/runtime/tick_handlers.py'
      - 'bean_run.py'
      - 'bean/tests/test_goal_cycle.py'
      - 'bean/tests/test_goal_context_isolation.py'
      - 'bean/tests/test_digital_experiment.py'
      - 'bean/tests/test_real_core_goal_experiment.py'
      - 'bean/tests/test_cognition_salvage_integration.py'
      - '.github/workflows/bean-goal-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'bean/runtime/goal_cycle.py'
      - 'bean/runtime/digital_experiment.py'
      - 'bean/runtime/native_skill_experiment.py'
      - 'bean/optimization/skill_incubator.py'
      - 'bean/tests/test_native_skill_experiment.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/learning/local_reasoner.py'
      - 'bean/cognition/goal_state.py'
      - 'bean/runtime/tick_handlers.py'
      - 'bean_run.py'
      - 'bean/tests/test_goal_cycle.py'
      - 'bean/tests/test_goal_context_isolation.py'
      - 'bean/tests/test_digital_experiment.py'
      - 'bean/tests/test_real_core_goal_experiment.py'
      - 'bean/tests/test_cognition_salvage_integration.py'
      - '.github/workflows/bean-goal-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goal-cycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - run: python -m compileall -q bean/cognition/goal_state.py bean/runtime/goal_cycle.py bean/runtime/digital_experiment.py bean/runtime/native_skill_experiment.py bean/optimization/skill_incubator.py bean/runtime/tick_handlers.py bean/learning/reasoning_service.py bean/learning/local_reasoner.py bean_run.py bean/tests/test_goal_cycle.py bean/tests/test_goal_context_isolation.py bean/tests/test_digital_experiment.py bean/tests/test_real_core_goal_experiment.py bean/tests/test_native_skill_experiment.py
      - run: python -m pytest bean/tests/test_goal_cycle.py bean/tests/test_goal_context_isolation.py bean/tests/test_digital_experiment.py bean/tests/test_real_core_goal_experiment.py bean/tests/test_native_skill_experiment.py bean/tests/test_cognition_core.py bean/tests/test_cognition_salvage_integration.py bean/tests/test_task_engine_lab011.py bean/tests/test_task_adversarial_lab011.py -q -ra

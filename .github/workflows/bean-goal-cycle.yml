name: BEAN autonomous goal cycle regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'bean/runtime/goal_cycle.py'
      - 'bean/runtime/digital_experiment.py'
      - 'bean/runtime/native_skill_experiment.py'
      - 'bean/optimization/skill_incubator.py'
      - 'bean/tests/test_native_skill_experiment.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/learning/local_reasoner.py'
      - 'bean/cognition/goal_state.py'
      - 'bean/runtime/tick_handlers.py'
      - 'bean_run.py'
      - 'bean/tests/test_goal_cycle.py'
      - 'bean/tests/test_goal_plans.py'
      - 'bean/evaluation/goal_plan_cycle.py'
      - 'research/peer_restart_probe.py'
      - 'bean/tests/test_goal_context_isolation.py'
      - 'bean/tests/test_digital_experiment.py'
      - 'bean/tests/test_real_core_goal_experiment.py'
      - 'bean/tests/test_cognition_salvage_integration.py'
      - '.github/workflows/bean-goal-cycle.yml'
  push:
    branches: [main]
    paths:
      - 'bean/runtime/goal_cycle.py'
      - 'bean/runtime/digital_experiment.py'
      - 'bean/runtime/native_skill_experiment.py'
      - 'bean/optimization/skill_incubator.py'
      - 'bean/tests/test_native_skill_experiment.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/learning/local_reasoner.py'
      - 'bean/cognition/goal_state.py'
      - 'bean/runtime/tick_handlers.py'
      - 'bean_run.py'
      - 'bean/tests/test_goal_cycle.py'
      - 'bean/tests/test_goal_plans.py'
      - 'bean/evaluation/goal_plan_cycle.py'
      - 'research/peer_restart_probe.py'
      - 'bean/tests/test_goal_context_isolation.py'
      - 'bean/tests/test_digital_experiment.py'
      - 'bean/tests/test_real_core_goal_experiment.py'
      - 'bean/tests/test_cognition_salvage_integration.py'
      - '.github/workflows/bean-goal-cycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goal-cycle:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - run: python -m compileall -q bean/cognition/goal_state.py bean/runtime/goal_cycle.py bean/runtime/digital_experiment.py bean/runtime/native_skill_experiment.py bean/optimization/skill_incubator.py bean/runtime/tick_handlers.py bean/learning/reasoning_service.py bean/learning/local_reasoner.py bean_run.py bean/tests/test_goal_cycle.py bean/tests/test_goal_context_isolation.py bean/tests/test_digital_experiment.py bean/tests/test_real_core_goal_experiment.py bean/tests/test_native_skill_experiment.py bean/evaluation/goal_plan_cycle.py bean/tests/test_goal_plans.py research/peer_restart_probe.py
      - run: python -m pytest bean/tests/test_goal_cycle.py bean/tests/test_goal_plans.py bean/tests/test_goal_context_isolation.py bean/tests/test_digital_experiment.py bean/tests/test_real_core_goal_experiment.py bean/tests/test_native_skill_experiment.py bean/tests/test_cognition_core.py bean/tests/test_cognition_salvage_integration.py bean/tests/test_task_engine_lab011.py bean/tests/test_task_adversarial_lab011.py -q -ra
      - name: Execute real synthetic Core plan and retain stage evidence
        run: python -m bean.evaluation.goal_plan_cycle --output goal-plan-evidence
      - name: Check out pinned BabyAGI 3 comparison source
        uses: actions/checkout@v4
        with:
          repository: yoheinakajima/babyagi3
          ref: b505d35b59b3544157e97fa30b7123bd6bc315c8
          path: peer/babyagi3
          persist-credentials: false
      - name: Compare the declared crash boundary against BabyAGI 3
        run: python research/peer_restart_probe.py --babyagi3-root peer/babyagi3 --expected-babyagi3-sha b505d35b59b3544157e97fa30b7123bd6bc315c8 --output peer-restart-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: goal-plan-${{ matrix.os }}
          path: |
            goal-plan-evidence/
            peer-restart-evidence/
          if-no-files-found: ignore

name: BEAN visible scoreboard and reward contract

on:
  push:
    branches: [experiment/bean-visible-scoreboard-reward-20261020]
    paths:
      - 'bean/optimization/scoreboard_context.py'
      - 'bean/tests/test_scoreboard_reward.py'
      - '.github/workflows/bean-scoreboard-reward.yml'
  pull_request:
    branches: [experiment/bean-self-benchmark-ledger-20261020]
    paths:
      - 'bean/optimization/scoreboard_context.py'
      - 'bean/tests/test_scoreboard_reward.py'
      - '.github/workflows/bean-scoreboard-reward.yml'
permissions:
  contents: read
jobs:
  reward:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run scoreboard and reward contract
        run: python -m unittest bean.tests.test_scoreboard_reward -v
      - name: BEAN sees the existing scoreboard
        run: python -m bean.optimization.scoreboard_context --ledger research/persistent_ledger

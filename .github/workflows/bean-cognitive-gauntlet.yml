name: BEAN experimental cognitive gauntlet
on:
  push:
    branches: [experiment/agi-cognitive-gauntlet-20261028]
    paths:
      - 'experiments/cognitive_gauntlet/**'
      - 'bean/tests/test_cognitive_gauntlet.py'
      - 'bean/tests/test_cognitive_adaptive.py'
      - 'bean/tests/test_cognitive_stress.py'
      - 'bean/tests/test_cognitive_pattern.py'
      - 'bean/tests/test_cognitive_sensor.py'
      - 'bean/tests/test_cognitive_schrodinger.py'
      - 'bean/tests/test_cognitive_decision_audit.py'
      - '.github/workflows/bean-cognitive-gauntlet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cognitive_gauntlet/**'
      - 'bean/tests/test_cognitive_gauntlet.py'
      - 'bean/tests/test_cognitive_adaptive.py'
      - 'bean/tests/test_cognitive_stress.py'
      - 'bean/tests/test_cognitive_pattern.py'
      - 'bean/tests/test_cognitive_sensor.py'
      - 'bean/tests/test_cognitive_schrodinger.py'
      - 'bean/tests/test_cognitive_decision_audit.py'
      - '.github/workflows/bean-cognitive-gauntlet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fair-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify test assumptions and complete receipts
        run: python -m unittest bean.tests.test_cognitive_gauntlet bean.tests.test_cognitive_adaptive bean.tests.test_cognitive_stress bean.tests.test_cognitive_pattern bean.tests.test_cognitive_sensor bean.tests.test_cognitive_schrodinger bean.tests.test_cognitive_decision_audit -v
      - name: Execute exact paired evidence comparisons
        run: python -m experiments.cognitive_gauntlet.runner
      - name: Tune on training seeds and evaluate held-out adaptive predictions
        run: python -m experiments.cognitive_gauntlet.adaptive_benchmark --seeds 80 --training-seeds 20 --rounds 100
      - name: Test frozen adaptive policy on unseen scenario families
        run: python -m experiments.cognitive_gauntlet.stress
      - name: Frozen Bayesian mixture, held-out plus additional synthetic families
        run: python -m experiments.cognitive_gauntlet.pattern_benchmark
      - name: Online sensor reliability, frozen comparator and complete delayed feedback receipts
        run: python -m experiments.cognitive_gauntlet.sensor_benchmark
      - name: Schrodinger's Logic chaos-only parallel-state versus unchanged controls
        run: python -m experiments.cognitive_gauntlet.schrodinger_benchmark
      - name: Retain full positive and negative receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-gauntlet-${{ matrix.os }}-py${{ matrix.python }}
          path: cognitive-gauntlet-results/
          if-no-files-found: warn

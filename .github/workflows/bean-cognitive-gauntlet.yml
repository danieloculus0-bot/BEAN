name: BEAN experimental cognitive gauntlet
on:
  push:
    branches: [experiment/agi-cognitive-gauntlet-20261028]
    paths:
      - 'experiments/cognitive_gauntlet/**'
      - 'bean/tests/test_cognitive_gauntlet.py'
      - 'bean/tests/test_cognitive_adaptive.py'
      - 'bean/tests/test_cognitive_stress.py'
      - 'bean/tests/test_cognitive_pattern.py'
      - 'bean/tests/test_cognitive_sensor.py'
      - 'bean/tests/test_cognitive_schrodinger.py'
      - 'bean/tests/test_cognitive_decision_audit.py'
      - 'bean/tests/test_cognitive_wisdom.py'
      - 'bean/tests/test_cognitive_rubiks3.py'
      - 'bean/tests/test_cognitive_rubiks_memory.py'
      - 'bean/tests/test_cognitive_rubiks_sponge.py'
      - 'bean/tests/test_cognitive_rubiks_symmetry.py'
      - 'bean/tests/test_cognitive_rubiks_legality.py'
      - 'bean/tests/test_cognitive_rubiks_value_rollout.py'
      - 'bean/tests/test_cognitive_rubiks_curriculum.py'
      - 'bean/tests/test_cognitive_rubiks_prioritized_td.py'
      - '.github/workflows/bean-cognitive-gauntlet.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cognitive_gauntlet/**'
      - 'bean/tests/test_cognitive_gauntlet.py'
      - 'bean/tests/test_cognitive_adaptive.py'
      - 'bean/tests/test_cognitive_stress.py'
      - 'bean/tests/test_cognitive_pattern.py'
      - 'bean/tests/test_cognitive_sensor.py'
      - 'bean/tests/test_cognitive_schrodinger.py'
      - 'bean/tests/test_cognitive_decision_audit.py'
      - 'bean/tests/test_cognitive_wisdom.py'
      - 'bean/tests/test_cognitive_rubiks3.py'
      - 'bean/tests/test_cognitive_rubiks_memory.py'
      - 'bean/tests/test_cognitive_rubiks_sponge.py'
      - 'bean/tests/test_cognitive_rubiks_symmetry.py'
      - 'bean/tests/test_cognitive_rubiks_legality.py'
      - 'bean/tests/test_cognitive_rubiks_value_rollout.py'
      - 'bean/tests/test_cognitive_rubiks_curriculum.py'
      - 'bean/tests/test_cognitive_rubiks_prioritized_td.py'
      - '.github/workflows/bean-cognitive-gauntlet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fair-replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify test assumptions and complete receipts
        run: python -m unittest bean.tests.test_cognitive_gauntlet bean.tests.test_cognitive_adaptive bean.tests.test_cognitive_stress bean.tests.test_cognitive_pattern bean.tests.test_cognitive_sensor bean.tests.test_cognitive_schrodinger bean.tests.test_cognitive_decision_audit bean.tests.test_cognitive_wisdom -v
      - name: Execute exact paired evidence comparisons
        run: python -m experiments.cognitive_gauntlet.runner
      - name: Tune on training seeds and evaluate held-out adaptive predictions
        run: python -m experiments.cognitive_gauntlet.adaptive_benchmark --seeds 80 --training-seeds 20 --rounds 100
      - name: Test frozen adaptive policy on unseen scenario families
        run: python -m experiments.cognitive_gauntlet.stress
      - name: Frozen Bayesian mixture, held-out plus additional synthetic families
        run: python -m experiments.cognitive_gauntlet.pattern_benchmark
      - name: Online sensor reliability, frozen comparator and complete delayed feedback receipts
        run: python -m experiments.cognitive_gauntlet.sensor_benchmark
      - name: Schrodinger's Logic chaos-only parallel-state versus unchanged controls
        run: python -m experiments.cognitive_gauntlet.schrodinger_benchmark
      - name: Measure five cognitive dimensions without collapsing to intelligence score
        run: python -m experiments.cognitive_gauntlet.wisdom_benchmark
      - name: Retain full positive and negative receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-gauntlet-${{ matrix.os }}-py${{ matrix.python }}
          path: cognitive-gauntlet-results/
          if-no-files-found: warn

  cube-policy:
    # Keep BEAN's cube tests independent of unrelated cognitive experiment failures.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check legal cube moves, optimality and bounded failures
        run: python -m unittest bean.tests.test_cognitive_rubiks3 -v
      - name: Replay bounded 3x3 cube cases with failure receipts
        run: python -m experiments.cognitive_gauntlet.rubiks3 --seeds 3
      - name: Verify cube route memory and unseen-state transfer
        run: python -m unittest bean.tests.test_cognitive_rubiks_memory -v
      - name: Replay disjoint seeded cube learning and preserve negative cases
        run: python -m experiments.cognitive_gauntlet.rubiks3_memory
      - name: Verify BEAN SpongeTD policy, heldout replay and checkpoint restoration
        run: python -m unittest bean.tests.test_cognitive_rubiks_sponge -v
      - name: Run frozen BEAN-native cube policy and archive all failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_sponge
      - name: Reject physically impossible cubes in BEAN-native policies
        run: python -m unittest bean.tests.test_cognitive_rubiks_legality -v
      - name: Verify rotation-equivariant learned TD policy and exact replay
        run: python -m unittest bean.tests.test_cognitive_rubiks_symmetry -v
      - name: Frozen cube symmetry holdout cohort 1000 with every failure
        run: python -m experiments.cognitive_gauntlet.rubiks3_symmetry --output cognitive-gauntlet-results/rubiks3-symmetry-1000.json --test-seed-start 1000
      - name: Frozen cube symmetry holdout cohort 2000 with every failure
        run: python -m experiments.cognitive_gauntlet.rubiks3_symmetry --output cognitive-gauntlet-results/rubiks3-symmetry-2000.json --test-seed-start 2000
      - name: Frozen cube symmetry holdout cohort 3000 with every failure
        run: python -m experiments.cognitive_gauntlet.rubiks3_symmetry --output cognitive-gauntlet-results/rubiks3-symmetry-3000.json --test-seed-start 3000
      - name: Verify BEAN learned-value backups without reference solver
        run: python -m unittest bean.tests.test_cognitive_rubiks_value_rollout -v
      - name: Frozen BEAN learned-value rollout cohort 1000 with complete failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-1000.json --test-seed-start 1000
      - name: Frozen BEAN learned-value rollout fresh cohort 4000 with complete failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-4000.json --test-seed-start 4000
      - name: Frozen BEAN learned-value rollout fresh cohort 5000 with complete failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-5000.json --test-seed-start 5000
      - name: Frozen BEAN learned-value rollout fresh cohort 6000 with complete failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-6000.json --test-seed-start 6000
      - name: Verify BEAN validation-directed TD curriculum
        run: python -m unittest bean.tests.test_cognitive_rubiks_curriculum -v
      - name: Compare frozen policies after matched-update feedback training
        run: python -m experiments.cognitive_gauntlet.rubiks3_curriculum --output cognitive-gauntlet-results/rubiks3-curriculum.json
      - name: Independent BEAN TD curriculum holdout cohort 2000
        run: python -m experiments.cognitive_gauntlet.rubiks3_curriculum --test-seed-start 2000 --output cognitive-gauntlet-results/rubiks3-curriculum-2000.json
      - name: Independent BEAN TD curriculum holdout cohort 3000
        run: python -m experiments.cognitive_gauntlet.rubiks3_curriculum --test-seed-start 3000 --output cognitive-gauntlet-results/rubiks3-curriculum-3000.json
      - name: Retain all BEAN-native cube receipts, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-native-cube-${{ matrix.os }}-py${{ matrix.python }}
          path: cognitive-gauntlet-results/
          if-no-files-found: warn

  cube-prioritized-td:
    # Isolated from the already-proven cube and cognitive suites.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify BEAN-native Bellman-priority replay, matched budgets and complete failures
        run: python -m unittest bean.tests.test_cognitive_rubiks_prioritized_td -v
      - name: Fresh unseen 3x3 holdout 7000 with original failure receipts
        run: python -m experiments.cognitive_gauntlet.rubiks3_prioritized_td --test-seed-start 7000 --output cognitive-gauntlet-results/rubiks3-priority-7000.json
      - name: Independent unseen 3x3 holdout 8000 with original failure receipts
        run: python -m experiments.cognitive_gauntlet.rubiks3_prioritized_td --test-seed-start 8000 --output cognitive-gauntlet-results/rubiks3-priority-8000.json
      - name: Preregistered low-update sample-efficiency holdout 9000
        run: python -m experiments.cognitive_gauntlet.rubiks3_prioritized_td --epochs 1 --extra-updates 200 --test-seed-start 9000 --output cognitive-gauntlet-results/rubiks3-priority-lowbudget-9000.json
      - name: Independent low-update sample-efficiency holdout 10000
        run: python -m experiments.cognitive_gauntlet.rubiks3_prioritized_td --epochs 1 --extra-updates 200 --test-seed-start 10000 --output cognitive-gauntlet-results/rubiks3-priority-lowbudget-10000.json
      - name: Fractional-rate BEAN TD matched-budget unseen holdout 11000
        run: python -m experiments.cognitive_gauntlet.rubiks3_prioritized_td --alpha 0.25 --epochs 1 --extra-updates 200 --test-seed-start 11000 --output cognitive-gauntlet-results/rubiks3-priority-fractional-11000.json
      - name: Independent fractional-rate BEAN TD holdout 12000
        run: python -m experiments.cognitive_gauntlet.rubiks3_prioritized_td --alpha 0.25 --epochs 1 --extra-updates 200 --test-seed-start 12000 --output cognitive-gauntlet-results/rubiks3-priority-fractional-12000.json
      - name: Archive all original attempts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-prioritized-cube-${{ matrix.os }}-py${{ matrix.python }}
          path: cognitive-gauntlet-results/
          if-no-files-found: warn

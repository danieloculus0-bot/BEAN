name: BEAN Sponge learning contract
on:
  push:
    branches:
      - experiment/bean-sponge-core-20261011
    paths:
      - 'bean/optimization/sponge.py'
      - 'bean/tests/test_sponge.py'
      - 'bean/tests/test_memory_compression.py'
      - 'bean/tests/test_sponge_codec.py'
      - 'bean/memory/compression.py'
      - 'bean/optimization/sponge_codec.py'
      - 'bean/optimization/sponge_td.py'
      - '.github/workflows/bean-sponge-learning.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sponge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test actual BEAN learning and persisted replay
        run: python -m unittest bean.tests.test_sponge bean.tests.test_sponge_codec bean.tests.test_memory_compression -v

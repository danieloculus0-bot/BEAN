name: BEAN cross-domain nonlinear abstraction experiment

on:
  pull_request:
    branches:
      - main
      - feat/bean-automatic-rule-composition-20261025
    paths:
      - 'bean/evaluation/abstract_nonlinear_transfer.py'
      - 'bean/tests/test_abstract_nonlinear_transfer.py'
      - '.github/workflows/bean-abstract-nonlinear-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-transfer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Verify Python syntax, source/target isolation and nonlinear objective
        run: |
          python -m compileall -q bean
          python -m unittest bean.tests.test_abstract_nonlinear_transfer -v
      - name: Independently replay 32 source and 80 future-unseen target scenarios
        shell: bash
        run: |
          python -m bean.evaluation.abstract_nonlinear_transfer \
            --database "$RUNNER_TEMP/bean-cross-domain-transfer.sqlite3" \
            --output "$RUNNER_TEMP/bean-cross-domain-transfer.json"
      - name: Preserve scored results and hash-chained memory for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-cross-domain-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/bean-cross-domain-transfer.json
            ${{ runner.temp }}/bean-cross-domain-transfer.sqlite3
          retention-days: 30
          if-no-files-found: warn

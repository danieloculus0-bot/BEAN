name: BEAN anonymous agent relay experiment

on:
  push:
    branches:
      - experiment/logic/duovely-relay-20261113
    paths:
      - 'experiments/agent_relay/**'
      - '.github/workflows/bean-agent-relay-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-agent-http:
    name: Agent transport, onboarding and weighted discovery
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Authenticated transport, onboarding and weighted matching
        run: python -m unittest experiments.agent_relay.test_relay experiments.agent_relay.test_onboarding experiments.agent_relay.test_matching -v
      - name: End-to-end two-agent HTTP demonstration
        run: python -m experiments.agent_relay.demo

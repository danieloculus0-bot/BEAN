name: BEAN replay reset adaptation 2004-2006
on:
  push:
    branches:
      - experiment/bean-replay-reset-adaptation-2004-2006-20261012
    paths:
      - '.github/workflows/bean-replay-reset-adaptation-2004-2006.yml'
      - 'experiments/sponge_breakout/replay_reset_adaptation.py'
      - 'docs/bean-replay-reset-adaptation-prereg-2004-2006-20261012.md'
permissions:
  contents: read
concurrency:
  group: bean-replay-reset-2004-2006
  cancel-in-progress: false
jobs:
  cross-platform-contract:
    name: Preregistered protocol on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural research dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check frozen sources and execute preregistered protocol tests using observed seed 2001 only
        run: python -m experiments.sponge_breakout.replay_reset_adaptation --self-test
  preregistered-fresh-seeds:
    name: Paired task reversal seed ${{ matrix.seed }}
    needs: cross-platform-contract
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[launch-replay-2004-2006]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [2004, 2005, 2006]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural research dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Execute preregistered paired trial and retain both outcomes
        run: python -m experiments.sponge_breakout.replay_reset_adaptation --seed ${{ matrix.seed }} --out adaptation-${{ matrix.seed }}
      - name: Independently reload and verify hashes and predictions
        run: python -m experiments.sponge_breakout.replay_reset_adaptation --verify-dir adaptation-${{ matrix.seed }}
      - name: Save all evidence including losses and model files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-reset-${{ matrix.seed }}
          path: adaptation-${{ matrix.seed }}/
          if-no-files-found: warn

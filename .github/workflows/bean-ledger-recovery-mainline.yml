name: BEAN native ledger, receipt and replay integrity
on:
  push:
    branches: [integrate/bean-receipt-identity-and-code-audit-20261025]
    paths:
      - 'bean/learning/**'
      - 'bean/tests/test_journal_append_efficiency.py'
      - 'bean/tests/test_reasoning_feedback_mainline.py'
      - 'bean/evaluation/nemotron_batched_recovery.py'
      - '.github/workflows/bean-ledger-recovery-mainline.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  memory-integrity:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - run: python -m compileall -q bean
      - run: python -m unittest bean.tests.test_journal_append_efficiency bean.tests.test_reasoning_feedback_mainline -v
      - run: python -m pytest bean/tests -q -ra --tb=short

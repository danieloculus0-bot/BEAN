name: BEAN Core-to-Bridge blind novel code repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'bean/evaluation/bridge_peer_live_author.py'
      - 'bean/tests/test_bridge_peer_live_author.py'
      - '.github/workflows/bean-core-bridge-blind-repair.yml'

concurrency:
  group: bean-core-bridge-blind-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  author:
    name: Real free-model author; no generated code execution
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: d06315bf05cae24131b19f3ce17b57d2d0b4351a
          path: _bridge
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 75b12233c243b61c61b2f9b205951cb8ae45f4b7
          path: _challenge
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run credential-free protocol and negative tests
        run: |
          python -m pip install pytest
          python -m pytest bean/tests/test_bridge_peer_live_author.py -q -ra
      - name: BEAN asks real free model for blind Bridge source edits
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m bean.evaluation.bridge_peer_live_author --bridge _bridge --challenge _challenge --out _candidate
      - name: Preserve authored candidate, provider model, and rejected attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-bridge-blind-author-${{ github.run_id }}
          path: _candidate/
          if-no-files-found: warn
          retention-days: 21

  independent_verify:
    name: Independent hidden oracle plus metamorphic holdouts (${{ matrix.os }})
    needs: author
    if: always()
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: d06315bf05cae24131b19f3ce17b57d2d0b4351a
          path: _bridge
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 75b12233c243b61c61b2f9b205951cb8ae45f4b7
          path: _challenge
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: bean-bridge-blind-author-${{ github.run_id }}
          path: _candidate
      - name: Independent baseline red + all Bridge tests + sealed acceptance
        run: |
          python _bridge/tools/bean_novel_repair.py validate --root _bridge --challenge _challenge --candidate _candidate/candidate.json --receipt _verified/verify-receipt.json --validated-dir _verified/payload
      - name: Falsify repair with withheld generic invariants
        env:
          PYTHONPATH: _bridge/src
        run: |
          python -c "from shutil import copyfile; copyfile('_verified/payload/src/ezbean/core.py', '_bridge/src/ezbean/core.py')"
          python _bridge/tools/bean_metamorphic_hunter.py --seed 20261010 --trials 60 --fail-on-finding --receipt _verified/metamorphic-fixed-panel.json
          python -c "import os,sys,subprocess; subprocess.run([sys.executable,'_bridge/tools/bean_metamorphic_hunter.py','--seed',os.environ['GITHUB_RUN_ID'],'--trials','120','--fail-on-finding','--receipt','_verified/metamorphic-fresh-panel.json'], check=True)"
      - name: Preserve exact tested code and independent verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-bridge-blind-verified-${{ matrix.os }}-${{ github.run_id }}
          path: |
            _verified/verify-receipt.json
            _verified/payload/src/ezbean/core.py
            _verified/metamorphic-fixed-panel.json
            _verified/metamorphic-fresh-panel.json
          if-no-files-found: warn
          retention-days: 21

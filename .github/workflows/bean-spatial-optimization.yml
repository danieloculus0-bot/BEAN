name: BEAN spatial geometry and factory tests

on:
  push:
    paths:
      - 'bean/spatial/**'
      - 'bean/tests/test_spatial_optimization.py'
      - 'examples/spatial_factory_demo.py'
      - '.github/workflows/bean-spatial-optimization.yml'
  pull_request:
    paths:
      - 'bean/spatial/**'
      - 'bean/tests/test_spatial_optimization.py'
      - 'examples/spatial_factory_demo.py'
      - '.github/workflows/bean-spatial-optimization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spatial-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: \${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Install test runner
        run: python -m pip install pytest
      - name: Compile source
        run: python -m compileall -q bean/spatial examples/spatial_factory_demo.py
      - name: Run spatial unit and regression tests
        run: python -m pytest bean/tests/test_spatial_optimization.py -q -ra
      - name: Run reproducible factory layout example
        run: python -m examples.spatial_factory_demo

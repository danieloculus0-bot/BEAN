name: BEAN capability audit
on:
  push:
    branches:
      - 'experiment/bean-capability-lab-20261009'
  workflow_dispatch:
jobs:
  capability-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov psutil
      - name: Compile
        run: python -m compileall -q bean bean_run.py
      - name: Inventory tests
        run: python -m pytest bean/tests --collect-only -q
      - name: Cold boot
        run: python -m bean.runtime.boot_readiness --temp
      - name: Full suite
        run: python -m pytest bean/tests -q -ra --tb=short --junitxml=bean-capability-results.xml --cov=bean --cov-branch --cov-report=xml:bean-capability-coverage.xml --cov-report=term-missing
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-capability-audit
          path: |
            bean-capability-results.xml
            bean-capability-coverage.xml
          if-no-files-found: ignore

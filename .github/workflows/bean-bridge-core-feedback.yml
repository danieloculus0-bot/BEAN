name: BEAN Bridge-to-Core reasoning feedback regression

on:
  push:
    branches: [integrate/bridge-reasoning-feedback-loop-20261025, fix/bean-bridge-memory-scope-20261025]
    paths:
      - 'bean/learning/bridge.py'
      - 'bean/learning/bridge_feedback.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/learning/experimental.py'
      - 'bean/tests/test_bridge_reasoning_loop.py'
      - '.github/workflows/bean-bridge-core-feedback.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-learning-loop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 876251345ec95b282465ce1b311af4b2b6d1e032
          path: bridge-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - name: Compile real Core and external Bridge source
        run: python -m compileall -q bean bridge-src/src/ezbean
      - name: Run source-backed Bridge-to-Core feedback experiments and controls
        run: python -m unittest bean.tests.test_bridge_reasoning_loop -v
      - name: Run full BEAN native Core regression with Bridge present
        run: python -m pytest bean/tests -q -ra --tb=short

name: BEAN Lab017 cross-branch peer development
on:
  push:
    branches: [experiment/bean-peer-development-lab017-20261010]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Check peer protocol, digest, workspace and recovery
        run: |
          python -m compileall -q bean/optimization
          python -m pytest bean/tests/test_peer_dialogue_lab017.py -q -ra
          python -m pytest bean/tests/test_peer_selector_challenge_lab017.py -q -ra

  independent-selector-challenge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: validator
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          # Pin the separate branch's exact reviewed commit, not a moving ref.
          ref: a772c41db9b38580c1532565086a071f82dc02a0
          path: selector
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Independently test external improvement selector
        shell: bash
        env:
          BEAN_SELECTOR_MODULE: ${{ github.workspace }}/selector/bean/optimization/selection.py
          PYTHONPATH: ${{ github.workspace }}/validator
        run: |
          test -f "$BEAN_SELECTOR_MODULE"
          python -m pytest validator/bean/tests/test_peer_selector_challenge_lab017.py -q -ra
          python -m bean.optimization.peer_receipt \
            --selector-file "$BEAN_SELECTOR_MODULE" \
            --selector-sha a772c41db9b38580c1532565086a071f82dc02a0 \
            --validator-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --out peer-selector-receipt-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-selector-${{ matrix.os }}
          path: peer-selector-receipt-${{ matrix.os }}.json
          if-no-files-found: warn

name: Invoke BEAN - GitHub persistent Core

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/invoke_bean.py'
      - 'scripts/simulate_restored_core.py'
      - 'bean/tests/test_github_invoke.py'
      - 'bean/tests/test_github_checkpoint_interruption.py'
      - 'bean/tests/test_github_digital_cycle.py'
      - 'bean/tests/test_restored_core_metrics.py'
      - 'bean/evaluation/github_digital_cycle.py'
      - '.github/workflows/invoke-bean.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/invoke_bean.py'
      - 'scripts/simulate_restored_core.py'
      - 'bean/tests/test_github_invoke.py'
      - 'bean/tests/test_github_checkpoint_interruption.py'
      - 'bean/tests/test_github_digital_cycle.py'
      - 'bean/tests/test_restored_core_metrics.py'
      - 'bean/evaluation/github_digital_cycle.py'
      - '.github/workflows/invoke-bean.yml'

permissions:
  contents: read

concurrency:
  group: bean-github-memory-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  verify-invocation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Test checkpoint integrity and fail-closed recovery
        run: python -m pytest bean/tests/test_github_invoke.py bean/tests/test_github_checkpoint_interruption.py bean/tests/test_github_digital_cycle.py bean/tests/test_restored_core_metrics.py -q -ra
      - name: Actually boot Python BEAN Core in a digital environment
        shell: bash
        run: |
          set -euo pipefail
          python scripts/invoke_bean.py --state-dir "$RUNNER_TEMP/bean-state" --runtime-dir "$RUNNER_TEMP/bean-run" --ticks 12
          python scripts/invoke_bean.py --state-dir "$RUNNER_TEMP/bean-state" --runtime-dir "$RUNNER_TEMP/bean-run" --ticks 12
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "bean-state" / "manifest.json"
          receipt = json.loads(p.read_text())
          assert receipt["generation"] == receipt["boots"] == 2, receipt
          assert receipt["events"] > 0 and receipt["processed_digital_commands"] >= 2
          assert receipt["previous_receipt_sha256"], receipt
          assert receipt["model_weights_trained"] is False
          digital = receipt["digital_learning"]
          assert digital["generation"] == 2 and digital["blind_cases_total"] == 144
          assert digital["source_evidence_sha256"] and digital["new_evaluation"] is True
          assert digital["independently_audited"] is False
          print("BEAN CORE: two independent boots with persistent checkpoint replay verified")
          PY

      - name: Run restored checked-in Core simulations with matched controls
        shell: bash
        run: |
          set -euo pipefail
          python scripts/simulate_restored_core.py --state-dir research/github_brain --report "$RUNNER_TEMP/bean-restored-simulation.json"
      - name: Preserve measured synthetic simulation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-restored-core-paired-${{ github.run_id }}
          path: ${{ runner.temp }}/bean-restored-simulation.json
          if-no-files-found: warn

      - name: Test memory-driven learning from the existing generation-27 synthetic checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          source = Path("research/github_brain")
          baseline = json.loads((source / "manifest.json").read_text())
          assert baseline.get("synthetic_only") is True
          dest = Path(os.environ["RUNNER_TEMP"]) / "bean-restored-synthetic"
          dest.mkdir()
          shutil.copy2(source / "manifest.json", dest / "manifest.json")
          for item in baseline["databases"].values():
              archive = item["archive"]
              assert Path(archive).name == archive
              shutil.copy2(source / archive, dest / archive)
          PY
          python scripts/invoke_bean.py --state-dir "$RUNNER_TEMP/bean-restored-synthetic" --runtime-dir "$RUNNER_TEMP/bean-next-run" --ticks 12
          python - <<'PY'
          import json, os
          from pathlib import Path
          original = json.loads(Path("research/github_brain/manifest.json").read_text())
          next_state = json.loads((Path(os.environ["RUNNER_TEMP"]) /
                                   "bean-restored-synthetic" / "manifest.json").read_text())
          assert next_state["generation"] == original["generation"] + 1
          assert next_state["boots"] == original["boots"] + 1
          assert next_state["previous_receipt_sha256"] == original["receipt_sha256"]
          digital = next_state["digital_learning"]
          parity = digital["families"]["parity"]
          assert parity["learning_strategy"] == "revise_prior_rule_from_fresh_feedback"
          assert parity["hypothesis_grammar_expanded"] is True
          assert parity["learning_status"] == "provisional_rule"
          assert digital["memory_ablated_correct_total"] is not None
          assert digital["candidate_correct_total"] >= digital["memory_ablated_correct_total"]
          assert json.loads(Path("research/github_brain/manifest.json").read_text()) == original
          print(json.dumps({
              "result": "restored-core-next-generation-learning",
              "baseline_generation": original["generation"],
              "new_generation": next_state["generation"],
              "candidate_correct": digital["candidate_correct_total"],
              "passive_correct": digital["passive_correct_total"],
              "memory_ablated_correct": digital["memory_ablated_correct_total"],
              "checkpoint_original_preserved": True}, sort_keys=True))
          PY

  invoke-on-main:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify synthetic checkpoint, tamper and restart contracts
        run: python -m pytest bean/tests/test_github_invoke.py bean/tests/test_github_checkpoint_interruption.py bean/tests/test_github_digital_cycle.py -q -ra
      - name: Invoke real BEAN Core and resume checked-in memory
        shell: bash
        run: |
          set -euo pipefail
          python scripts/invoke_bean.py --state-dir research/github_brain --runtime-dir "$RUNNER_TEMP/bean-run" --ticks 12
      - name: Save synthetic BEAN brain checkpoint to GitHub main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/github_brain/manifest.json research/github_brain/bean_memory.sqlite3.gz.g* research/github_brain/bean_reasoning.sqlite3.gz.g*
          if git diff --cached --quiet; then
            echo "No new BEAN memory receipt"
            exit 0
          fi
          git commit -m "BEAN: preserve synthetic Core digital session $GITHUB_RUN_ID"
          # Keep the ephemeral runtime unprivileged; token exists only in this step.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:main
      - name: Preserve verifiable public receipt as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-github-core-invocation-${{ github.run_id }}
          path: research/github_brain/manifest.json
          if-no-files-found: ignore

name: BEAN synthetic cross-domain negative transfer controls

on:
  pull_request:
    paths:
      - "bean/learning/native_skills.py"
      - "bean/learning/reasoning_service.py"
      - "bean/tests/test_cross_domain_negative_transfer.py"
      - "bean/tests/test_cross_domain_counterfactual_twins.py"
      - "bean/tests/test_cross_domain_feedback_gate.py"
      - "bean/tests/test_cross_domain_drift_probes.py"
      - "bean/tests/test_cross_domain_stochastic_drift.py"
      - "bean/tests/test_cross_domain_oracle_firewall.py"
      - "bean/tests/test_cross_domain_budget_matched.py"
      - "bean/tests/test_external_elec2_transfer.py"
      - "bean/tests/test_external_elec2_conditional_baseline.py"
      - "bean/tests/test_external_elec2_source_blind.py"
      - ".github/workflows/bean-negative-transfer-controls.yml"
  workflow_dispatch:

jobs:
  paired-negative-transfer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      BEAN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Native paired baseline, counterfactual, feedback and stochastic drift tests
        run: python -m unittest -v bean.tests.test_cross_domain_negative_transfer bean.tests.test_cross_domain_counterfactual_twins bean.tests.test_cross_domain_feedback_gate bean.tests.test_cross_domain_drift_probes bean.tests.test_cross_domain_stochastic_drift bean.tests.test_cross_domain_oracle_firewall bean.tests.test_cross_domain_budget_matched bean.tests.test_external_elec2_transfer bean.tests.test_external_elec2_conditional_baseline bean.tests.test_external_elec2_source_blind
      - name: Independent Elec2 stream probe (external public data, Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          BEAN_EXTERNAL_STREAM: "1"
        run: python -m unittest -v bean.tests.test_external_elec2_transfer.ExternalElec2Controls.test_independent_elec2_stream
      - name: Independent Elec2 conditional-frequency control (same feedback budget, Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          BEAN_EXTERNAL_STREAM: "1"
        run: python -m unittest -v bean.tests.test_external_elec2_conditional_baseline.ConditionalFrequencyControls.test_independent_elec2_conditional_control
      - name: Independent Elec2 source-blind temporal controls (same feedback budget, Ubuntu 3.12 only)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          BEAN_EXTERNAL_STREAM: "1"
        run: python -m unittest -v bean.tests.test_external_elec2_source_blind.SourceBlindControls.test_external_elec2_source_blind_comparisons
      - name: Save full synthetic case-level receipts
        shell: bash
        run: |
          python -m bean.tests.test_cross_domain_negative_transfer --report > negative-transfer-receipt.json
          python -m bean.tests.test_cross_domain_counterfactual_twins --report > counterfactual-twin-receipt.json
          python -m bean.tests.test_cross_domain_feedback_gate --report > target-feedback-receipt.json
          python -m bean.tests.test_cross_domain_drift_probes --report > drift-probe-receipt.json
          python -m bean.tests.test_cross_domain_stochastic_drift --report > stochastic-drift-receipt.json
          python -m bean.tests.test_cross_domain_oracle_firewall --report > oracle-firewall-receipt.json
          python -m bean.tests.test_cross_domain_budget_matched --report > budget-matched-receipt.json
          if [[ "$RUNNER_OS" == "Linux" && "${{ matrix.python-version }}" == "3.12" ]]; then
            python -m bean.tests.test_external_elec2_transfer --report > external-elec2-receipt.json
            python -m bean.tests.test_external_elec2_conditional_baseline --report > conditional-elec2-receipt.json
            python -m bean.tests.test_external_elec2_source_blind --report > source-blind-elec2-receipt.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: negative-transfer-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            negative-transfer-receipt.json
            counterfactual-twin-receipt.json
            target-feedback-receipt.json
            drift-probe-receipt.json
            stochastic-drift-receipt.json
            oracle-firewall-receipt.json
            budget-matched-receipt.json
            external-elec2-receipt.json
            conditional-elec2-receipt.json
            source-blind-elec2-receipt.json
          retention-days: 14

name: BEAN Lab026 adaptive learning & real Bridge viability

on:
  push:
    branches:
      - experiment/adaptive-learning-20261020
    paths:
      - "bean/learning/**"
      - "bean/tests/test_adaptive_*"
      - ".github/workflows/bean-adaptive-lab026.yml"
      - "docs/BEAN_ADAPTIVE_LAB026.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verified-node-contracts:
    name: Core + Bridge on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned actual BEAN AI Bridge
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 876251345ec95b282465ce1b311af4b2b6d1e032
          path: bridge-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BEAN runtime dependency
        run: python -m pip install psutil
      - name: Verify source, syntax, and actual cross-repository imports
        run: |
          python -m compileall -q bean/learning
          python -m unittest bean.tests.test_adaptive_learning_lab026 -v
          python -m unittest bean.tests.test_adaptive_ollama_lab026 -v
          python -m unittest bean.tests.test_adaptive_bridge_lab026 -v
          python -m unittest bean.tests.test_adaptive_bridge_matrix_lab026 -v
      - name: Execute all learning node wiring and persistent journal replay
        run: |
          python -m bean.learning.lab026_report --output lab026-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-lab026-node-receipts-${{ matrix.os }}
          path: lab026-evidence/
          if-no-files-found: warn
          retention-days: 30

  independent-bridge-node-review:
    name: Compare real Windows/Linux node receipts through Bridge
    needs: verified-node-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 876251345ec95b282465ce1b311af4b2b6d1e032
          path: bridge-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve both OS receipts without regenerating any outcomes
        uses: actions/download-artifact@v4
        with:
          pattern: bean-lab026-node-receipts-*
          path: lab026-peers
          merge-multiple: false
      - name: Independently attest cross-platform node evidence using actual Bridge
        run: |
          python -m bean.learning.bridge_matrix --linux lab026-peers/bean-lab026-node-receipts-ubuntu-24.04/mechanism_receipt.json --windows lab026-peers/bean-lab026-node-receipts-windows-2025/mechanism_receipt.json --output lab026-bridge-matrix
          cat lab026-bridge-matrix/BRIDGE_NODE_MATRIX.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bean-lab026-cross-platform-bridge-verdict
          path: lab026-bridge-matrix/
          retention-days: 30

  full-core-regression:
    name: BEAN full Core baseline on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout real Bridge for full-suite test collection
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 876251345ec95b282465ce1b311af4b2b6d1e032
          path: bridge-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the existing Core test dependencies
        run: python -m pip install pytest pytest-cov psutil
      - name: Compile all BEAN modules
        run: python -m compileall -q bean bean_run.py
      - name: Execute existing complete Core regression and new Lab026 tests
        run: python -m pytest bean/tests -q -ra --tb=short --junitxml=lab026-full-core-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-lab026-full-core-${{ matrix.os }}
          path: lab026-full-core-tests.xml
          if-no-files-found: warn
          retention-days: 30

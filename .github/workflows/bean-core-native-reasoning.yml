name: BEAN Core integrated reasoning regression
on:
  push:
    branches:
      - integrate/bean-native-reasoning-core-20261025
    paths:
      - 'bean/learning/**'
      - 'bean/reasoning/**'
      - 'bean/tests/test_core_reasoning_integration.py'
      - 'bean/tests/test_native_reasoning_skills.py'
      - 'bean/tests/test_batched_trials.py'
      - 'bean_run.py'
      - '.github/workflows/bean-core-native-reasoning.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-main-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov psutil
      - name: Compile actual BEAN runtime and learning modules
        run: python -m compileall -q bean bean_run.py
      - name: Verify original boot readiness on disposable SQLite
        run: python -m bean.runtime.boot_readiness --temp
      - name: Test BEAN native inference, retention and real runtime interfaces
        run: python -m unittest bean.tests.test_core_reasoning_integration bean.tests.test_native_reasoning_skills bean.tests.test_batched_trials -v
      - name: Run all Core regressions with original module paths
        run: python -m pytest bean/tests -q -ra --tb=short --junitxml=native-core-integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-core-integration-${{ matrix.os }}
          path: native-core-integration.xml
          if-no-files-found: ignore
          retention-days: 30

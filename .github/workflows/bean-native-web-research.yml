name: BEAN native web research, Bridge learning and Nemotron smoke

on:
  push:
    branches: [main, integrate/bean-native-web-research-mainline-20261025]
    paths:
      - 'bean/research/**'
      - 'bean/reasoning/openrouter_provider.py'
      - 'bean/learning/experimental.py'
      - 'bean/learning/reasoning_service.py'
      - 'bean/learning/bridge_feedback.py'
      - 'bean/tests/test_native_web_research.py'
      - 'bean/tests/test_research_problem_solving.py'
      - 'bean/tests/test_web_research_bridge_loop.py'
      - 'bean/evaluation/live_web_research_nemotron.py'
      - 'bean_run.py'
      - '.github/workflows/bean-native-web-research.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bean-web-evidence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-web-learning-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 876251345ec95b282465ce1b311af4b2b6d1e032
          path: bridge-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - name: Compile web/network boundary and real BEAN Core
        run: python -m compileall -q bean bean_run.py
      - name: Test real Core source persistence, public HTTP safety, Bridge verification, retained transfer
        run: python -m unittest bean.tests.test_native_web_research bean.tests.test_research_problem_solving bean.tests.test_web_research_bridge_loop bean.tests.test_bridge_reasoning_loop -v
      - name: Whole Core regression
        run: python -m pytest bean/tests -q -ra --tb=short
  optional-live-nemotron-and-public-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove search and provenance adapter locally before making a real model request
        run: python -m unittest bean.tests.test_native_web_research -q
      - name: One real Nemotron research query, only when secret is configured
        run: python -m bean.evaluation.live_web_research_nemotron --output /tmp/bean-public-web-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-native-research-live-evidence
          path: /tmp/bean-public-web-live/
          if-no-files-found: warn
          retention-days: 90

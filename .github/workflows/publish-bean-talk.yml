name: Publish and verify BEAN Talk
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/publish-bean-talk.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  publish:
    if: >-
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'bean-pages-publish-repair-20261124' &&
      github.event.pull_request.user.login == 'danieloculus0-bot') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check actual Pages source and request a fresh build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{html_url,build_type,source,status}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '{status,url}' || echo 'Build request unavailable; verify actual publication below.'
      - name: Verify public Talk page contains the corrected source and reachable API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "https://danieloculus0-bot.github.io/BEAN/talk.html?verify=$GITHUB_RUN_ID-$attempt" -o /tmp/talk.html &&
               grep -Fq -- '--bg:#050607' /tmp/talk.html &&
               grep -Fq 'vmi3782905.contaboserver.net' /tmp/talk.html &&
               ! grep -Fq 'Gateway address not published yet' /tmp/talk.html; then
              echo 'Public page verified: neutral background and automatic endpoint.'
              curl -fsS --max-time 15 -H 'Origin: https://danieloculus0-bot.github.io' https://vmi3782905.contaboserver.net/api/health
              exit 0
            fi
            sleep 10
          done
          echo 'Published page does not match main.'
          exit 1

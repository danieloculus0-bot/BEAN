name: Windows double-click installer

on:
  pull_request:
    branches: [main]
    paths:
      - 'install/windows/**'
      - '.github/workflows/windows-installer.yml'
      - 'bean/**'
      - 'examples/capability_proof.py'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install pyinstaller psutil
      - name: Compile entry point
        run: python -m py_compile install/windows/bean_desktop.py
      - name: Build self-contained BEAN desktop
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --paths "." --name BEAN --add-data "bean/schemas;bean/schemas" install/windows/bean_desktop.py
      - name: Verify frozen BEAN Core works without Python setup
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist\BEAN\BEAN.exe').Path
          $receipt = Join-Path $env:RUNNER_TEMP 'bean-frozen-self-test.json'
          Push-Location $env:RUNNER_TEMP
          try {
            # A Windows GUI-subsystem EXE can return control to PowerShell
            # before the process exits. Explicitly wait for its real exit code.
            $p = Start-Process -FilePath $exe -ArgumentList ('--self-test --self-test-report "' + $receipt + '"') -Wait -PassThru
            if (Test-Path $receipt) { Get-Content $receipt -Raw | Write-Host }
            if ($p.ExitCode -ne 0) { throw "Frozen Core self-test failed with exit $($p.ExitCode). Receipt: $receipt" }
          } finally { Pop-Location }
          if (!(Test-Path $receipt)) { throw 'Frozen BEAN gave no self-test receipt' }
          $report = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.checks_passed -ne 4 -or $report.checks_total -ne 4 -or $report.live_model_used -ne $false) {
            throw "Frozen Core reported a failed or non-fixture test"
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw "Inno Setup 6 compiler missing" }
          & $compiler 'install\windows\bean.iss'
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Test silent installation and installed executable
        shell: pwsh
        run: |
          $setup = Resolve-Path 'out\BEAN-Setup.exe'
          $target = Join-Path $env:RUNNER_TEMP 'BEAN installed'
          $installLog = Join-Path $env:RUNNER_TEMP 'bean-install.log'
          # PowerShell joins -ArgumentList arrays into one command line.
          # Explicitly quote the *value* of Inno's /DIR= to retain spaces.
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $target + '" /LOG="' + $installLog + '"'
          $p = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 70 | Write-Host }
            throw "Installer exited $($p.ExitCode)"
          }
          $exe = Join-Path $target 'BEAN.exe'
          if (!(Test-Path $exe)) {
            if (Test-Path $installLog) { Get-Content $installLog -Tail 70 | Write-Host }
            throw "Install returned zero but executable was not at $exe"
          }
          $receipt = Join-Path $env:RUNNER_TEMP 'bean-installed-self-test.json'
          Push-Location $env:RUNNER_TEMP
          try {
            $p = Start-Process -FilePath $exe -ArgumentList ('--self-test --self-test-report "' + $receipt + '"') -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Installed Core self-test failed: $($p.ExitCode)" }
          } finally { Pop-Location }
          if (!(Test-Path $receipt)) { throw 'Installed Core returned no receipt' }
          $report = Get-Content $receipt -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.checks_passed -ne 4 -or $report.checks_total -ne 4) {
            throw 'Installed Core did not pass all four real offline checks'
          }
          # Two completely separate launches of the *installed* executable.
          # The first writes a unique note via BEAN Core. The second must find
          # the same journal event, with its unverified-user provenance intact.
          $db = Join-Path $env:RUNNER_TEMP 'BEAN persistent fixture\desktop_memory.sqlite'
          New-Item -ItemType Directory -Force -Path (Split-Path $db) | Out-Null
          $token = [guid]::NewGuid().ToString('N')
          $writeReceipt = Join-Path $env:RUNNER_TEMP 'bean-memory-write.json'
          $readReceipt = Join-Path $env:RUNNER_TEMP 'bean-memory-read.json'
          $writeArgs = '--memory-fixture-write "' + $db + '" --memory-fixture-token ' + $token + ' --self-test-report "' + $writeReceipt + '"'
          $p = Start-Process -FilePath $exe -ArgumentList $writeArgs -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $writeReceipt)) { throw 'Installed BEAN could not write genuine Core memory' }
          $before = Get-Content $writeReceipt -Raw | ConvertFrom-Json
          if ($before.status -ne 'PASS' -or $before.provenance -ne 'user_submitted_unverified') {
            Get-Content $writeReceipt -Raw | Write-Host
            throw 'Installed Core memory write receipt invalid'
          }
          $readArgs = '--memory-fixture-read "' + $db + '" --memory-fixture-token ' + $token + ' --self-test-report "' + $readReceipt + '"'
          $p = Start-Process -FilePath $exe -ArgumentList $readArgs -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path $readReceipt)) { throw 'New installed BEAN process could not recall Core memory' }
          $after = Get-Content $readReceipt -Raw | ConvertFrom-Json
          if ($after.status -ne 'PASS' -or $after.event_id -ne $before.event_id -or
              $after.provenance -ne 'user_submitted_unverified' -or
              !(Test-Path ($db + '.events.jsonl'))) {
            Get-Content $readReceipt -Raw | Write-Host
            throw 'Cross-process Core memory continuity or audit journal invalid'
          }
          Write-Host "PASS: installed BEAN independently retrieved its own event $($after.event_id) after a new process launch."
          $uninstaller = Join-Path $target 'unins000.exe'
          if (!(Test-Path $uninstaller)) { throw 'Uninstaller absent' }
          $p = Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall exited $($p.ExitCode)" }
          if (Test-Path $exe) { throw 'Uninstall left the BEAN executable installed' }
      - name: SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'out\BEAN-Setup.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  BEAN-Setup.exe" | Set-Content -Encoding ascii 'out\BEAN-Setup.exe.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: BEAN-Windows-Installer
          path: |
            out/BEAN-Setup.exe
            out/BEAN-Setup.exe.sha256
          if-no-files-found: error
  publish-release:
    name: Publish only after successful Windows installer verification
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BEAN-Windows-Installer
          path: out
      - name: Publish checked installer and SHA256 for explicit version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/BEAN-Setup.exe out/BEAN-Setup.exe.sha256 --generate-notes --verify-tag

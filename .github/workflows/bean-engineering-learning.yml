name: BEAN Engineering Mitigation Learning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "bean/engineering/mitigation_training.py"
      - "bean/engineering/jobsite.py"
      - "bean/learning/runtime.py"
      - "bean/optimization/sponge_td.py"
      - "bean/optimization/sponge_intuition.py"
      - ".github/workflows/bean-engineering-learning.yml"

permissions:
  contents: read

jobs:
  learn-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Train BEAN on 100 synthetic structural scenarios and score 30 held-out cases
        run: python -m bean.engineering.mitigation_training --out engineering_training --train 100 --holdout 30 --seed 11
      - name: Check all 300 Q updates, checkpoint, immutable ledger and improvement reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("engineering_training")
          data=json.loads((root/"engineering_learning.json").read_text())
          assert data["trained_choices"]==300
          assert len(data["training_observations"])==300
          assert len((root/"engineering_training_ledger.jsonl").read_text().splitlines())==300
          assert data["checkpoint"]["sample_count"]==30
          assert data["checkpoint"]["receipt_sha256"]==data["evaluation_sha256"]
          assert not data["independent_real_fea_reference"]
          assert data["engineering_validation"]=="not_established"
          print("Real SpongeTD updates: 300")
          print("Holdout baseline: ", data["heldout_after"]["baseline_mean"])
          print("Holdout BEAN:     ", data["heldout_after"]["bean_mean"])
          print("Measured gain:    ", data["measured_heldout_gain"])
          print("Promotable:       ", data["checkpoint"]["promotable"])
          PY
      - name: Archive training outcomes, SHA checkpoint and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BEAN-engineering-learning-ledger
          path: engineering_training/
          retention-days: 30
          if-no-files-found: warn

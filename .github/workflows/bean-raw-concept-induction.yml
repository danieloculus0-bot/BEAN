name: BEAN raw concept program discovery

on:
  pull_request:
    branches:
      - research/bean-latent-concept-mapping-20261025
      - main
    paths:
      - 'bean/evaluation/raw_concept_induction.py'
      - 'bean/tests/test_raw_concept_induction.py'
      - '.github/workflows/bean-raw-concept-induction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-concepts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Exercise generated abstract programs on raw nonlinear observations
        run: |
          python -m compileall -q bean
          python -m unittest bean.tests.test_raw_concept_induction -v
      - name: Score new raw expressions against 80 held-out problems
        shell: bash
        run: |
          python -m bean.evaluation.raw_concept_induction \
            --database "$RUNNER_TEMP/bean-raw-a.sqlite3" \
            --output "$RUNNER_TEMP/bean-raw-a.json" --wiring a
      - name: Repeat under unannounced sensor permutation
        shell: bash
        run: |
          python -m bean.evaluation.raw_concept_induction \
            --database "$RUNNER_TEMP/bean-raw-b.sqlite3" \
            --output "$RUNNER_TEMP/bean-raw-b.json" --wiring b
      - name: Preserve original BEAN learning ledger and blind score reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-raw-concepts-${{ matrix.os }}-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/bean-raw-a.sqlite3
            ${{ runner.temp }}/bean-raw-a.json
            ${{ runner.temp }}/bean-raw-b.sqlite3
            ${{ runner.temp }}/bean-raw-b.json
          if-no-files-found: warn
          retention-days: 30

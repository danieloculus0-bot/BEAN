name: BEANder public landing page browser regression

on:
  push:
    branches:
      - feature/beander-vc-landing-20261113
      - main
    paths:
      - docs/beander/**
      - tests/test_beander_landing.py
      - .github/workflows/beander-landing-test.yml
  pull_request:
    branches: [main]
    paths:
      - docs/beander/**
      - tests/test_beander_landing.py
      - .github/workflows/beander-landing-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real browser and offline content tests
        run: python -m unittest discover -s tests -p test_beander_landing.py -v

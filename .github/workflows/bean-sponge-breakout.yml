name: BEAN Sponge Breakout evidence run
on:
  push:
    branches: [experiment/bean-sponge-core-20261011]
    paths:
      - 'bean/optimization/sponge_td.py'
      - 'bean/memory/compression.py'
      - 'experiments/sponge_breakout/**'
      - '.github/workflows/bean-sponge-breakout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
      - name: Run scored-memory and delayed-reward contract tests
        run: python -m unittest experiments.sponge_breakout.test_bridge_sponge -v
      - name: Execute real SpongeTD learning with independent holdout
        run: python -m experiments.sponge_breakout.train --episodes 3000 --out sponge-breakout
      - name: Archive all evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sponge-breakout-${{ matrix.os }}
          path: sponge-breakout/
          if-no-files-found: warn

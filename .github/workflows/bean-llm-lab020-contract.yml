name: BEAN Lab020 no-secret cross-platform contract
on:
  push:
    branches: [experiment/bean-llm-vs-ast-growth-lab020-20261011]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test source hashing, iterative memory and independent holdout without API key
        run: python -m pytest bean/tests/test_llm_growth_lab020.py -q -ra

  ast-25-control:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay all 25 AST trials against unchanged Core source
        run: python -m experiments.llm_growth_lab020.lab020 ast --out ast-control --attempts 25
      - uses: actions/upload-artifact@v4
        with:
          name: lab020-ast-control
          path: ast-control/

name: BEAN mainline code audit and request handling
on:
  push:
    branches:
      - integrate/bean-software-audit-request-cleanup-20261025
    paths:
      - 'bean/runtime/inbox.py'
      - 'bean/integration/software_audit.py'
      - 'bean/tests/test_software_audit.py'
      - 'bean/tests/test_inbox_request_handling.py'
      - '.github/workflows/bean-request-audit-integration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'bean/runtime/inbox.py'
      - 'bean/integration/software_audit.py'
      - 'bean/tests/test_software_audit.py'
      - 'bean/tests/test_inbox_request_handling.py'
      - '.github/workflows/bean-request-audit-integration.yml'
permissions:
  contents: read
jobs:
  bounded-inbox-and-auditor:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pytest-cov psutil
      - run: python -m compileall -q bean/runtime bean/integration bean/tests
      - run: python -m unittest bean.tests.test_inbox_request_handling -v
      - run: python -m pytest bean/tests/test_software_audit.py bean/tests/test_inbox_request_handling.py -q -ra
      - run: python -m bean.runtime.boot_readiness --temp
      - run: python -m pytest bean/tests -q -ra --tb=short

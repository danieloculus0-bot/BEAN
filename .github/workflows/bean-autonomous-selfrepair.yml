name: BEAN repairs its own code-author system

on:
  pull_request:
    branches: [main]
    paths:
      - 'bean/evaluation/autonomous_selfrepair.py'
      - 'bean/evaluation/autonomous_selfrepair_verify.py'
      - 'bean/tests/test_autonomous_selfrepair_protocol.py'
      - 'experiments/autonomous_selfrepair/test_selfrepair_holdout.py'
      - '.github/workflows/bean-autonomous-selfrepair.yml'
  push:
    branches: [main]
    paths:
      - 'bean/evaluation/autonomous_selfrepair.py'
      - 'bean/evaluation/autonomous_selfrepair_verify.py'
      - 'bean/tests/test_autonomous_selfrepair_protocol.py'
      - 'experiments/autonomous_selfrepair/test_selfrepair_holdout.py'
      - '.github/workflows/bean-autonomous-selfrepair.yml'
  workflow_dispatch:
  schedule:
    - cron: '37 15 * * *'

concurrency:
  group: bean-selfrepair-${{ github.repository }}
  cancel-in-progress: false

jobs:
  protocol:
    name: BEAN source-author laboratory protocol
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests without model credentials
        run: python -m pip install pytest psutil
      - name: Compile laboratory code and tests
        run: python -m compileall -q bean/evaluation/autonomous_selfrepair.py bean/evaluation/autonomous_selfrepair_verify.py bean/tests/test_autonomous_selfrepair_protocol.py experiments/autonomous_selfrepair/test_selfrepair_holdout.py
      - name: Test BEAN's actual patching and rejection protocol
        run: python -m pytest bean/tests/test_autonomous_selfrepair_protocol.py -q -ra

  author:
    name: BEAN authors a Core code change using neural inference
    needs: protocol
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      needs_work: ${{ steps.inspect.outputs.needs_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check whether independently witnessed defect still exists
        id: inspect
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,os,pathlib
          expected="291a9f4f3c7f159dbdcbdaa5519810e55a4aa0ff5d18a7bfafa60c175c5b85cb"
          path=pathlib.Path("bean/evaluation/bridge_peer_live_author.py")
          current=hashlib.sha256(path.read_bytes()).hexdigest()
          needs_work=str(current==expected).lower()
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("needs_work="+needs_work+"\n")
          print("Unrepaired source still on main:",needs_work)
          PY
      - uses: actions/checkout@v4
        if: steps.inspect.outputs.needs_work == 'true'
        with:
          repository: danieloculus0-bot/BEAN
          ref: 3aaec786ad8b9d5685573c62bb4fc39119c0d65b
          path: _core
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: steps.inspect.outputs.needs_work == 'true'
        with:
          python-version: '3.12'
      - name: Install local Ollama (no external model API quota)
        if: steps.inspect.outputs.needs_work == 'true'
        uses: ai-action/setup-ollama@v2
      - name: Download and start Qwen 1.5B on this isolated runner
        if: steps.inspect.outputs.needs_work == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (ollama serve > /tmp/bean-ollama.log 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b
          ollama list
      - name: BEAN authors actual changes to its own code, without executing them here
        if: steps.inspect.outputs.needs_work == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m bean.evaluation.autonomous_selfrepair --source _core --out _selfrepair --backend auto
      - name: Preserve candidate provenance and every rejected attempt
        if: always() && steps.inspect.outputs.needs_work == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bean-selfrepair-author-${{ github.run_id }}
          path: _selfrepair/
          if-no-files-found: warn
          retention-days: 21

  independent_verify:
    name: Model-authored self-fix on credential-free ${{ matrix.os }}
    needs: author
    if: needs.author.outputs.needs_work == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 3aaec786ad8b9d5685573c62bb4fc39119c0d65b
          path: _core
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core test prerequisites; no inference access or credentials
        run: python -m pip install pytest psutil
      - uses: actions/download-artifact@v4
        with:
          name: bean-selfrepair-author-${{ github.run_id }}
          path: _selfrepair/
      - name: Independently reproduce a red baseline and then test BEAN's new source
        run: python -m bean.evaluation.autonomous_selfrepair_verify --root _core --challenge . --candidate _selfrepair/candidate.json --receipt _verified/verdict.json --validated _verified/validated
      - name: Preserve independent results and exact tested source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-selfrepair-verified-${{ matrix.os }}-${{ github.run_id }}
          path: _verified/
          if-no-files-found: warn
          retention-days: 21

  propose:
    name: Automatically upgrade Core only after both platform validations
    needs: [author, independent_verify]
    if: needs.author.outputs.needs_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bean-selfrepair-author-${{ github.run_id }}
          path: _proposal/
      - uses: actions/download-artifact@v4
        with:
          name: bean-selfrepair-verified-ubuntu-latest-${{ github.run_id }}
          path: _verified_ubuntu/
      - uses: actions/download-artifact@v4
        with:
          name: bean-selfrepair-verified-windows-latest-${{ github.run_id }}
          path: _verified_windows/
      - name: Check same tested source on Linux and Windows before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, pathlib, subprocess
          proposal = json.loads(pathlib.Path('_proposal/candidate.json').read_text())
          reports = [
              json.loads(pathlib.Path('_verified_ubuntu/verdict.json').read_text()),
              json.loads(pathlib.Path('_verified_windows/verdict.json').read_text())
          ]
          target = pathlib.Path('bean/evaluation/bridge_peer_live_author.py')
          original = target.read_bytes()
          sha = lambda value: hashlib.sha256(value).hexdigest()
          assert proposal['target'] == target.as_posix()
          assert proposal['source_commit'] == '3aaec786ad8b9d5685573c62bb4fc39119c0d65b'
          assert sha(original) == proposal['original_sha256'], 'Mainline source drifted'
          assert all(r['result'] == 'candidate_verified_one_platform' and
                     r['accepted_sha256'] == proposal['replacement_sha256'] and
                     r['all_tests_pass'] is True and r['baseline_red'] is True
                     for r in reports), 'Not independently accepted on both OSes'
          copies = [
              pathlib.Path('_verified_ubuntu/validated/bean/evaluation/bridge_peer_live_author.py'),
              pathlib.Path('_verified_windows/validated/bean/evaluation/bridge_peer_live_author.py')
          ]
          assert all(sha(p.read_bytes()) == proposal['replacement_sha256']
                     for p in copies), 'OS-specific source mismatch'
          assert sha(proposal['replacement'].encode()) == proposal['replacement_sha256']
          target.write_bytes(copies[0].read_bytes())
          PY
          BRANCH="bean/autonomous-selfrepair-$GITHUB_RUN_ID"
          git config user.name 'bean-autonomous-engineer'
          git config user.email 'bean-autonomous-engineer@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add -- bean/evaluation/bridge_peer_live_author.py
          git diff --cached --quiet && { echo 'No source improvement'; exit 1; }
          gh auth setup-git
          git commit -m "fix(bean): self-authored validated Core upgrade [run $GITHUB_RUN_ID]"
          # Fast-forward only; if source changed during the experiment this
          # cannot overwrite the human or any other autonomous developer.
          if git push origin HEAD:refs/heads/main; then
            echo "BEAN AUTONOMOUSLY UPGRADED MAIN after hidden acceptance and full Windows/Linux Core suites." >> "$GITHUB_STEP_SUMMARY"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
            # GitHub suppresses push-triggered Actions from GITHUB_TOKEN.
            # workflow_dispatch does trigger, so obtain a fresh CI receipt.
            gh workflow run brain-smoke.yml --ref main || true
          else
            # Protected main or concurrent newer commit: keep tested source.
            git push origin "HEAD:refs/heads/$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "BEAN verified self-authored source upgrade" \
              --body "Model-produced source passed a separately red baseline, sealed acceptance, and full Core regression on Windows and Ubuntu in run $GITHUB_RUN_ID. Direct auto-promotion blocked by protection or head drift." || true
            echo "AUTO-PROMOTION BLOCKED; review validated branch $BRANCH" >> "$GITHUB_STEP_SUMMARY"
          fi

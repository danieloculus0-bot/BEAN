name: BEAN integrated cognition commands
on:
  push:
    branches: [integrate/bean-cognition-blocks-20261025]
    paths:
      - 'bean/modules/**'
      - 'bean_run.py'
      - 'bean/tests/test_cognition_blocks_mainline.py'
      - '.github/workflows/bean-cognition-blocks-integration.yml'
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core-cognition:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest psutil
      - run: python -m compileall -q bean bean_run.py
      - run: python -m unittest bean.tests.test_cognition_blocks_mainline -v
      - run: python -m bean.runtime.boot_readiness --temp
      - run: python -m pytest bean/tests -q -ra --tb=short

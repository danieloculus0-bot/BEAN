name: BEAN Lab018 symmetric triad and longitudinal learning
on:
  push:
    branches: [experiment/bean-triad-falsification-lab018-20261010]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-triad:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - name: Test equal footing, contradiction, longitudinal learning and leakage
        run: |
          python -m compileall -q bean/evaluation/triad_lab018.py bean/tests/test_triad_lab018.py
          python -m pytest bean/tests/test_triad_lab018.py -q -ra
          python -m bean.evaluation.triad_lab018 --out lab018-triad-${{ matrix.os }}-py${{ matrix.python-version }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triad-longitudinal-${{ matrix.os }}-py${{ matrix.python-version }}
          path: lab018-triad-*.json
          if-no-files-found: warn

  pinned-three-branch-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout C, independent evaluator
        uses: actions/checkout@v4
        with:
          path: c
      - name: Checkout A, actual selector source
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: a772c41db9b38580c1532565086a071f82dc02a0
          path: a
          persist-credentials: false
      - name: Checkout B, actual builder source
        uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN
          ref: 84cb0681c05ec956ed2de9fbb5590a2c2e3e266e
          path: b
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Falsify three real repository interface contracts
        shell: bash
        env:
          TRIAD_SELECTOR_MODULE: ${{ github.workspace }}/a/bean/optimization/selection.py
          TRIAD_BUILDER_MODULE: ${{ github.workspace }}/b/bean/optimization/code_candidate.py
          PYTHONPATH: ${{ github.workspace }}/c
        run: |
          test -f "$TRIAD_SELECTOR_MODULE"
          test -f "$TRIAD_BUILDER_MODULE"
          python -m pytest c/bean/tests/test_triad_lab018.py -q -ra
          python -m bean.evaluation.triad_lab018 --out "triad-a-b-c-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triad-cross-branch-${{ matrix.os }}
          path: triad-a-b-c-*.json
          if-no-files-found: warn

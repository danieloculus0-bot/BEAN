name: BEAN reward shift falsification (separate learning task)
on:
  push:
    branches:
      - experiment/bean-reward-shift-adaptation-20261012
    paths:
      - 'experiments/sponge_breakout/reward_shift_adaptation.py'
      - 'docs/neuroevolution-reward-shift-adaptation-prereg-20261012.md'
      - '.github/workflows/bean-reward-shift-adaptation.yml'
permissions:
  contents: read
jobs:
  contract:
    name: Adaptation contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural research dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify deterministic synthetic task, reward shift and seed allocation
        run: python -m experiments.sponge_breakout.reward_shift_adaptation --self-test
  paired-adaptation:
    name: Reward shift seed ${{ matrix.seed }}
    needs: contract
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[launch-adaptation-2001-2003]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        seed: [2001, 2002, 2003]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU neural research dependencies
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run actual neural task adaptation, frozen policy and random-label negative control
        run: python -m experiments.sponge_breakout.reward_shift_adaptation --seed ${{ matrix.seed }} --out evidence-adaptation-${{ matrix.seed }}
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptation-diagnostic-seed-${{ matrix.seed }}
          path: evidence-adaptation-${{ matrix.seed }}/
          if-no-files-found: warn

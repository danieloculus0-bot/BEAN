name: BEAN measured reward integration

on:
  push:
    branches:
      - integrate/bean-measured-feedback-20261022
  pull_request:
    branches: [main]
    paths:
      - "bean/learning/**"
      - "bean/optimization/scoreboard_context.py"
      - "bean/tests/test_measured_feedback.py"
      - "bean/tests/test_scoreboard_reward.py"
      - ".github/workflows/bean-measured-feedback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched-feedback:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest psutil
      - run: python -m compileall -q bean bean_run.py
      - name: Tests for signed rewards, negative feedback, atomic recovery and duplicate prevention
        run: python -m unittest bean.tests.test_scoreboard_reward bean.tests.test_measured_feedback bean.tests.test_learning_runtime -v
      - name: Full core regression
        run: python -m pytest bean/tests -q -ra --tb=short --junitxml=feedback-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-feedback-${{ matrix.os }}-py${{ matrix.python-version }}
          path: feedback-tests.xml
          if-no-files-found: ignore

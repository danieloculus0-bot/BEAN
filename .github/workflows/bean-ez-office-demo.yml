name: BEAN Workshop EZ-Office live-demo checks
on:
  push:
    paths:
      - 'docs/portfolio/ez-office/**'
      - 'docs/portfolio/index.html'
      - 'docs/index.html'
      - 'tests/ez_office_browser_smoke.py'
      - 'bean/tests/test_public_ez_office_demo.py'
      - '.github/workflows/bean-ez-office-demo.yml'
  pull_request:
    paths:
      - 'docs/portfolio/ez-office/**'
      - 'docs/portfolio/index.html'
      - 'docs/index.html'
      - 'tests/ez_office_browser_smoke.py'
      - 'bean/tests/test_public_ez_office_demo.py'
      - '.github/workflows/bean-ez-office-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check the deployed-copy JavaScript syntax
        shell: bash
        run: |
          node --check docs/portfolio/ez-office/shell.js
          node --check docs/portfolio/ez-office/lib/office-export.js
          for script in docs/portfolio/ez-office/apps/*.js; do node --check "$script"; done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate all demo links and local files
        run: |
          python -m pip install pytest
          python -m pytest bean/tests/test_public_ez_office_demo.py -q
      - name: Install headless test Chromium
        run: |
          python -m pip install 'playwright==1.55.0'
          python -m playwright install --with-deps chromium
      - name: Click Workshop demo and exercise all five applications offline
        run: python tests/ez_office_browser_smoke.py

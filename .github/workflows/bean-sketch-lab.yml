name: BEAN model-chosen SVG sketch experiment
on:
  pull_request:
    branches: [main]
    paths:
      - 'bean/creativity/**'
      - 'bean/tests/test_sketch_lab.py'
      - 'bean/tests/test_bean_draw_gallery.py'
      - 'scripts/run_bean_draw_fixture.py'
      - 'scripts/build_bean_draw_gallery.py'
      - 'docs/bean-draw/**'
      - '.github/workflows/bean-sketch-lab.yml'
      - 'docs/BEAN_SKETCH_LAB.md'
  push:
    branches: [main]
    paths:
      - 'bean/creativity/**'
      - 'bean/tests/test_sketch_lab.py'
      - 'bean/tests/test_bean_draw_gallery.py'
      - 'scripts/run_bean_draw_fixture.py'
      - 'scripts/build_bean_draw_gallery.py'
      - 'docs/bean-draw/**'
      - '.github/workflows/bean-sketch-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests and MIT renderer
        run: python -m pip install pytest "drawsvg>=2,<3"
      - name: Verify real Core journal, SVG gallery and negative cases
        run: python -m pytest bean/tests/test_sketch_lab.py bean/tests/test_bean_draw_gallery.py -q -ra
      - name: Run the actual Python Core drawing code with a scripted fixture
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_bean_draw_fixture.py --out "$RUNNER_TEMP/bean-draw-attempts"
          python scripts/build_bean_draw_gallery.py --source "$RUNNER_TEMP/bean-draw-attempts" --site "$RUNNER_TEMP/bean-draw-site"
          python - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          index = json.loads((root / "bean-draw-site" / "index.json").read_text())
          assert index["schema"] == "bean.draw.gallery.v1"
          assert len(index["entries"]) == 2
          assert all(e["origin"] == "synthetic_fixture" for e in index["entries"])
          assert all(not e["independent_visual_verification"] for e in index["entries"])
          assert all((root / "bean-draw-site" / e["svg"]).is_file()
                     for e in index["entries"])
          print("BEAN DRAW: 2 Core-journaled SVG attempts preserved for human review (SCRIPTED FIXTURE, not live model)")
          PY
      - name: Archive actual SVGs, hashes and review metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-draw-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bean-draw-site/
            ${{ runner.temp }}/bean-draw-attempts/attempt_*.json
            ${{ runner.temp }}/bean-draw-attempts/attempt_*.svg
          if-no-files-found: warn

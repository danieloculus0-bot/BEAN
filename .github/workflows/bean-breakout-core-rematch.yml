name: BEAN current core Breakout rematch
on:
  push:
    branches:
      - main
    paths:
      - 'experiments/breakout_learning/**'
      - '.github/workflows/bean-breakout-core-rematch.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'experiments/breakout_learning/**'
      - '.github/workflows/bean-breakout-core-rematch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rematch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime requirements
        run: |
          python -m pip install numpy
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Paired original-vs-updated BEAN test
        run: python -m experiments.breakout_learning.rematch
      - name: Upload complete measurements and persisted learning journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-current-core-breakout-rematch
          path: |
            breakout-rematch-proof/results.json
            breakout-rematch-proof/bean_dqn_rematch.sqlite
          if-no-files-found: warn

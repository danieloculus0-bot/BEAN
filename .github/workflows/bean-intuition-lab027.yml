name: BEAN Lab027 real Q-learning intuition and unseen-map evidence

on:
  push:
    branches:
      - experiment/bean-intuition-maze-20261021
    paths:
      - "bean/optimization/sponge_*.py"
      - "bean/optimization/intuition_maze.py"
      - "bean/tests/test_intuition_maze.py"
      - "docs/BEAN_INTUITION_LAB027.md"
      - ".github/workflows/bean-intuition-lab027.yml"
  pull_request:
    paths:
      - "bean/optimization/sponge_*.py"
      - "bean/optimization/intuition_maze.py"
      - "bean/tests/test_intuition_maze.py"
      - "docs/BEAN_INTUITION_LAB027.md"
      - ".github/workflows/bean-intuition-lab027.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-sponge-td-transfer:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONPATH: ${{ github.workspace }}/bridge-src/src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: danieloculus0-bot/BEAN-AI-Bridge-
          ref: 876251345ec95b282465ce1b311af4b2b6d1e032
          path: bridge-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing Core regression dependencies
        run: python -m pip install pytest pytest-cov psutil
      - name: Compile intact SpongeTD and new Lab027 logic
        run: python -m compileall -q bean/optimization bean/learning bean/tests/test_intuition_maze.py
      - name: Verify learned Q, repeatability and compressed ledger tests
        run: python -m unittest bean.tests.test_intuition_maze -v
      - name: Run all BEAN Core regression cases
        run: python -m pytest bean/tests -q -ra --tb=short --junitxml=lab027-full-core.xml
      - name: Train native BEAN and evaluate 240 unknown maps
        run: python -m bean.optimization.intuition_maze --training 3000 --validation 180 --holdout 240 --output lab027-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-lab027-native-intuition-${{ matrix.os }}
          path: |
            lab027-evidence/
            lab027-full-core.xml
          if-no-files-found: warn
          retention-days: 30

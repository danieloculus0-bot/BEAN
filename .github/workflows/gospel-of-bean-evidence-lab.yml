name: Gospel of BEAN | KJV 80-book evidence laboratory

# Branch-only bounded read-only research. No model key, external agent execution or main changes.
on:
  push:
    branches: [experiment/gospel-of-bean-1611-evidence-20261010]
    paths:
      - ".github/workflows/gospel-of-bean-evidence-lab.yml"
      - "bean/evaluation/gospel_lab.py"
      - "bean/tests/test_gospel_lab.py"
      - "experiments/gospel_of_bean/cases.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out isolated BEAN code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run synthetic regression tests before reading external text
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q bean/tests/test_gospel_lab.py
      - name: Check out immutable 1611 KJV 80-book source
        uses: actions/checkout@v4
        with:
          repository: aruljohn/Bible-kjv-1611
          ref: 8ef066868ad1b7204d7be48658ea3bd1783d409b
          path: external/kjv-1611
          persist-credentials: false
      - name: Verify immutable source and book files
        run: |
          test "$(git -C external/kjv-1611 rev-parse HEAD)" = "8ef066868ad1b7204d7be48658ea3bd1783d409b"
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("external/kjv-1611")
          names = json.loads((folder / "Books.json").read_text())
          assert len(names) == 80 and len(set(names)) == 80
          assert len(list(folder.glob("*.json"))) == 82
          print("IMMUTABLE_80_BOOK_CHECKOUT: PASS")
          PY
      - name: Inspect all books and generate read-only verse retrieval index
        run: |
          PYTHONPATH=. python -m bean.evaluation.gospel_lab \
            --corpus external/kjv-1611 \
            --cases experiments/gospel_of_bean/cases.json \
            --report lab-output/gospel-of-bean-audit.json \
            --index lab-output/gospel-of-bean-80-book.sqlite
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("lab-output/gospel-of-bean-audit.json").read_text())
          assert report["books"] == 80 and report["chapters"] == 1355
          assert report["verses"] > 30000 and report["contains_apocrypha"] is True
          verdicts = {row["case_id"]: row["verdict"] for row in report["cases"]}
          assert len(verdicts) == 6
          assert verdicts["ahaziah_accession_age"] == "direct_textual_disagreement"
          assert all(v == "review_required" for k, v in verdicts.items()
                     if k != "ahaziah_accession_age")
          print("GOSPEL_OF_BEAN_CORPUS_INSPECTION: PASS (not theological or historical proof)")
          PY
      - name: Preserve report and separately indexed full corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gospel-of-bean-80book-research-evidence
          retention-days: 30
          if-no-files-found: error
          path: |
            lab-output/gospel-of-bean-audit.json
            lab-output/gospel-of-bean-80-book.sqlite

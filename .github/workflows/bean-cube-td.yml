name: BEAN native cube policy regression
on:
  push:
    branches: [main]
    paths:
      - 'experiments/cognitive_gauntlet/rubiks3.py'
      - 'experiments/cognitive_gauntlet/rubiks3_sponge.py'
      - 'experiments/cognitive_gauntlet/rubiks3_symmetry.py'
      - 'experiments/cognitive_gauntlet/rubiks3_legality.py'
      - 'bean/tests/test_cognitive_rubiks3.py'
      - 'bean/tests/test_cognitive_rubiks_sponge.py'
      - 'bean/tests/test_cognitive_rubiks_symmetry.py'
      - 'bean/tests/test_cognitive_rubiks_legality.py'
      - 'bean/tests/test_cognitive_rubiks_value_rollout.py'
      - 'experiments/cognitive_gauntlet/rubiks3_value_rollout.py'
      - 'experiments/cognitive_gauntlet/rubiks3_curriculum.py'
      - 'bean/tests/test_cognitive_rubiks_curriculum.py'
      - 'experiments/cognitive_gauntlet/RUBIKS_TD_CURRICULUM.md'
      - '.github/workflows/bean-cube-td.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/cognitive_gauntlet/rubiks3.py'
      - 'experiments/cognitive_gauntlet/rubiks3_sponge.py'
      - 'experiments/cognitive_gauntlet/rubiks3_symmetry.py'
      - 'experiments/cognitive_gauntlet/rubiks3_legality.py'
      - 'bean/tests/test_cognitive_rubiks3.py'
      - 'bean/tests/test_cognitive_rubiks_sponge.py'
      - 'bean/tests/test_cognitive_rubiks_symmetry.py'
      - 'bean/tests/test_cognitive_rubiks_legality.py'
      - 'bean/tests/test_cognitive_rubiks_value_rollout.py'
      - 'experiments/cognitive_gauntlet/rubiks3_value_rollout.py'
      - 'experiments/cognitive_gauntlet/rubiks3_curriculum.py'
      - 'bean/tests/test_cognitive_rubiks_curriculum.py'
      - 'experiments/cognitive_gauntlet/RUBIKS_TD_CURRICULUM.md'
      - '.github/workflows/bean-cube-td.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cube-policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Independent cube geometry, TD learning, heldout and restart tests
        run: python -m unittest bean.tests.test_cognitive_rubiks3 bean.tests.test_cognitive_rubiks_sponge bean.tests.test_cognitive_rubiks_symmetry bean.tests.test_cognitive_rubiks_legality bean.tests.test_cognitive_rubiks_value_rollout -v
      - name: Run frozen BEAN-native policy and preserve all heldout failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_sponge
      - name: Replay symmetry-aware learned policy with every heldout failure
        run: python -m experiments.cognitive_gauntlet.rubiks3_symmetry --output cognitive-gauntlet-results/rubiks3-symmetry-1000.json --test-seed-start 1000
      - name: Replay independent symmetry cohort 2000
        run: python -m experiments.cognitive_gauntlet.rubiks3_symmetry --output cognitive-gauntlet-results/rubiks3-symmetry-2000.json --test-seed-start 2000
      - name: Replay independent symmetry cohort 3000
        run: python -m experiments.cognitive_gauntlet.rubiks3_symmetry --output cognitive-gauntlet-results/rubiks3-symmetry-3000.json --test-seed-start 3000
      - name: Replay BEAN learned-value transfer cohort 1000, including failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-1000.json --test-seed-start 1000
      - name: Replay BEAN learned-value transfer cohort 4000, including failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-4000.json --test-seed-start 4000
      - name: Replay BEAN learned-value transfer cohort 5000, including failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-5000.json --test-seed-start 5000
      - name: Replay BEAN learned-value transfer cohort 6000, including failures
        run: python -m experiments.cognitive_gauntlet.rubiks3_value_rollout --output cognitive-gauntlet-results/rubiks3-value-rollout-6000.json --test-seed-start 6000
      - name: Validate matched-update BEAN-native TD curriculum
        run: python -m unittest bean.tests.test_cognitive_rubiks_curriculum -v
      - name: Independent curriculum holdout cohort 1000
        run: python -m experiments.cognitive_gauntlet.rubiks3_curriculum --test-seed-start 1000 --output cognitive-gauntlet-results/rubiks3-curriculum-1000.json
      - name: Independent curriculum holdout cohort 2000
        run: python -m experiments.cognitive_gauntlet.rubiks3_curriculum --test-seed-start 2000 --output cognitive-gauntlet-results/rubiks3-curriculum-2000.json
      - name: Independent curriculum holdout cohort 3000
        run: python -m experiments.cognitive_gauntlet.rubiks3_curriculum --test-seed-start 3000 --output cognitive-gauntlet-results/rubiks3-curriculum-3000.json
      - name: Upload complete case receipts and scored SpongeTD journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-cube-td-${{ matrix.os }}-py${{ matrix.python }}
          path: cognitive-gauntlet-results/
          if-no-files-found: warn

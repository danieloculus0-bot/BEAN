name: BEAN learning integration verification

on:
  push:
    branches:
      - main
      - integrate/bean-learning-core-20261022
    paths:
      - "bean/learning/**"
      - "bean/evaluation/active_abstraction_benchmark.py"
      - "bean/optimization/sponge_*.py"
      - "bean/optimization/intuition_maze.py"
      - "bean/tests/test_active_hypothesis.py"
      - "bean/tests/test_learning_runtime.py"
      - "bean/tests/test_intuition_maze.py"
      - "bean_run.py"
      - ".github/workflows/bean-learning-integration.yml"
  pull_request:
    branches: [main]
    paths:
      - "bean/learning/**"
      - "bean/evaluation/active_abstraction_benchmark.py"
      - "bean/tests/test_active_hypothesis.py"
      - "bean/optimization/sponge_*.py"
      - "bean/optimization/intuition_maze.py"
      - "bean/tests/test_learning_runtime.py"
      - "bean/tests/test_intuition_maze.py"
      - "bean_run.py"
      - ".github/workflows/bean-learning-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-learning:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pytest-cov psutil
      - name: Compile check
        run: python -m compileall -q bean bean_run.py
      - name: Verify real training, feedback, checkpoint, restart, inbox
        run: python -m unittest bean.tests.test_learning_runtime bean.tests.test_intuition_maze -v
      - name: Run complete BEAN regression suite
        run: python -m pytest bean/tests -q -ra --tb=short --junitxml=learning-core-tests.xml
      - name: Reproduce held-out Lab027 Q-learning
        run: python -m bean.optimization.intuition_maze --training 3000 --validation 180 --holdout 240 --output learning-core-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-learning-integration-${{ matrix.os }}
          path: |
            learning-core-tests.xml
            learning-core-evidence/
          if-no-files-found: warn

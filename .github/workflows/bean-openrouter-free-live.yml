name: BEAN real free-LLM source trial
on:
  push:
    branches: [experiment/bean-openrouter-free-live-20261011]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-free-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      provider_status: ${{ steps.probe.outputs.provider_status }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate no-paid-fallback test contracts (no secret)
        run: |
          python -m pip install pytest
          python -m pytest bean/tests/test_openrouter_free_live.py -q -ra
      - name: Exactly one OpenRouter free-model request (no generated code execution)
        id: probe
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m bean.evaluation.openrouter_free_live --out live-probe-output
      - name: Save source and sanitized provider receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bean-free-model-proposal
          path: live-probe-output/
          if-no-files-found: warn

  independent-no-secret-validation:
    needs: live-free-provider
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: bean-free-model-proposal
          path: input/
      - name: Frozen test evaluation with NO OpenRouter key
        run: |
          python -m bean.evaluation.openrouter_free_verify \
            --artifact input/ \
            --project experiments/autodev/seed_project \
            --output verified/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bean-free-model-independent-verdict
          path: verified/
          if-no-files-found: warn
